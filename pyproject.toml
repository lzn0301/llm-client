[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-client"
version = "0.1.0"
description = "Unified resilient LLM client with tier routing, strict HTTP timeouts, automatic model fallback, and cross-provider failover."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_client = ["default_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
